name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build and Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Package APK with Bubblewrap (TWA)
        run: |
          mkdir -p android-build
          cd android-build
          echo "Building Android TWA Package for Lala Story Lab..."
          # Initialize bubblewrap project using manifest URL
          bubblewrap init --manifest https://ais-pre-wdhrfc6nhnsuwsmdeljtbx-706030277309.asia-east1.run.app/manifest.webmanifest --skipPwaValidation || true
          bubblewrap build || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LalaStory-Android-APK
          path: |
            android-build/*.apk
            android-build/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
